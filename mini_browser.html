<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Mini Browser</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #202124; color: white; }
        .toolbar { background: #35363a; padding: 10px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #000; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #555; background: #202124; color: white; outline: none; }
        button { background: #8ab4f8; color: #202124; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        iframe { flex: 1; border: none; background: white; width: 100%; }
        .status-bar { font-size: 11px; padding: 4px 15px; background: #35363a; color: #999; border-top: 1px solid #444; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="text" id="urlInput" placeholder="Enter website (e.g. wikipedia.org)" value="wikipedia.org">
        <button onclick="navigate()">Browse</button>
    </div>
    <div id="status" class="status-bar">Ready to browse</div>

    <iframe id="viewport" sandbox="allow-scripts allow-same-origin allow-forms" title="Browser Window"></iframe>

    <script>
        // Catch-all for school Chromebooks to see errors without a console
        window.onerror = function(msg) {
            document.getElementById('status').innerText = "System Error: " + msg;
            alert("Technical Error: " + msg);
        };

        async function navigate() {
            const status = document.getElementById('status');
            const frame = document.getElementById('viewport');
            let targetUrl = document.getElementById('urlInput').value.trim();

            if (!targetUrl) return;
            if (!targetUrl.startsWith('http')) targetUrl = 'https://' + targetUrl;

            // Proxy rotation: tries AllOrigins first, then falls back to CorsProxy
            const proxies = [
                u => `https://api.allorigins.win{encodeURIComponent(u)}`,
                u => `https://corsproxy.io{encodeURIComponent(u)}`
            ];

            for (let i = 0; i < proxies.length; i++) {
                status.innerText = `Attempt ${i+1}: Bypassing security via proxy...`;
                try {
                    const response = await fetch(proxies[i](targetUrl));
                    if (!response.ok) throw new Error("Proxy connection failed");

                    // Handle different proxy return formats (JSON vs Text)
                    let html = i === 0 ? (await response.json()).contents : await response.text();
                    
                    if (html) {
                        // The Base Tag Fix: Rewrites relative links and images automatically
                        const baseTag = `<base href="${targetUrl}/">`;
                        frame.srcdoc = html.includes('<head>') ? html.replace('<head>', '<head>' + baseTag) : baseTag + html;
                        
                        status.innerText = "Page Loaded Successfully: " + targetUrl;
                        return; // Exit loop on success
                    }
                } catch (err) {
                    console.log(`Proxy ${i+1} failed:`, err);
                }
            }
            status.innerText = "Error: All proxies were blocked. Check for ad-blockers.";
        }

        document.getElementById('urlInput').addEventListener('keypress', e => { if (e.key === 'Enter') navigate(); });
    </script>
</body>
</html>

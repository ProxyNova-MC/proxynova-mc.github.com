<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chromebook Mini-Browser</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1a1a1a; color: white; }
        .toolbar { background: #333; padding: 10px; display: flex; gap: 8px; align-items: center; }
        input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #000; color: white; }
        button { padding: 8px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        iframe { flex: 1; border: none; background: white; width: 100%; }
        #debug { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,0,0,0.8); color: white; padding: 5px; font-size: 10px; display: none; }
    </style>
</head>
<body>
    <div class="toolbar">
        <input type="text" id="url" placeholder="example.com" value="wikipedia.org">
        <button onclick="browse()">Browse</button>
    </div>
    <iframe id="view" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <div id="debug"></div>

    <script>
        // Forces errors to show up even if your console is disabled
        window.onerror = function(m, u, l) {
            const d = document.getElementById('debug');
            d.style.display = 'block';
            d.innerText = `LOG: ${m} at line ${l}`;
        };

        async function browse() {
            let target = document.getElementById('url').value.trim();
            if (!target.startsWith('http')) target = 'https://' + target;
            
            const frame = document.getElementById('view');
            const debug = document.getElementById('debug');
            debug.innerText = "Attempting to bypass filter...";

            // School filters often block "allorigins.win". 
            // Try "corsproxy.io" as a backup.
            const proxy = `https://corsproxy.io{encodeURIComponent(target)}`;

            try {
                const res = await fetch(proxy);
                if (!res.ok) throw new Error(`Proxy Blocked (Status: ${res.status})`);
                
                const html = await res.text();
                const base = `<base href="${target}/">`;
                frame.srcdoc = html.includes('<head>') ? html.replace('<head>', '<head>'+base) : base+html;
                debug.style.display = 'none';
            } catch (e) {
                debug.style.display = 'block';
                debug.innerText = "CRITICAL: The school firewall blocked the proxy service.";
            }
        }
    </script>
</body>
</html>
